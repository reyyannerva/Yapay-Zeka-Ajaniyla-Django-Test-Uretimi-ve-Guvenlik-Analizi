openapi: 3.0.3
info:
  title: Yapay Zekâ Ajanıyla Django Test Üretimi ve Güvenlik Analizi API
  version: 0.4.0
  description: 'Hafta 4 backend API''si: SimpleJWT kimlik doğrulama, hesap kilidi
    ve şifre sıfırlama (H4-02), proje yönetimi ve güvenli ZIP yükleme (H4-03), analiz
    çalıştırmaları ve referans gereksinimler (H4-04). Korumalı uç noktalar `Authorization:
    Bearer <access token>` ister. Ayrıntılı kılavuz: docs/api/README.md.'
paths:
  /api/analysis-runs/:
    get:
      operationId: analysis_runs_list
      description: |-
        Yalnızca kullanıcının projelerine ait analizler (sayfasız dizi).

        Durum değerleri: birincil iş akışı `QUEUED` → `ANALYZING` → `GENERATING` → `EXECUTING` → `COMPLETED` / `FAILED`; model ayrıca `VALIDATING`, `SCANNING` ve `CANCELLED` durumlarını destekler (veri sözlüğü 8). Bu sürümde analiz oluşturmak **arka plan görevi başlatmaz**: kayıt `QUEUED` durumunda oluşturulur, `celery_task_id`, `started_at` ve `finished_at` null kalır (Celery entegrasyonu sonraki iş kalemidir).
      summary: Analizlerimi listele
      tags:
      - Analiz İşlemleri
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisRunList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenError'
              examples:
                TokenYok:
                  value:
                    detail: Giriş bilgileri verilmedi.
                  summary: Token yok
                GeçersizVeyaSüresiDolmuşToken:
                  value:
                    detail: Verilen token hiçbir token tipi için geçerli değil
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is invalid
                  summary: Geçersiz veya süresi dolmuş token
          description: Kimlik doğrulama yok, token geçersiz veya süresi dolmuş.
    post:
      operationId: analysis_runs_create
      description: |-
        Sahip olunan bir proje için analiz kaydı oluşturur. `RULE_BASED` yönteminde `llm_provider`/`llm_model` verilmez; `DIRECT_LLM` ve `HYBRID` yöntemlerinde ikisi de zorunludur. Projede aktif analiz varsa 400 döner. Projenin aktif referans gereksinimleri `requirements_snapshot` olarak saklanır.

        Durum değerleri: birincil iş akışı `QUEUED` → `ANALYZING` → `GENERATING` → `EXECUTING` → `COMPLETED` / `FAILED`; model ayrıca `VALIDATING`, `SCANNING` ve `CANCELLED` durumlarını destekler (veri sözlüğü 8). Bu sürümde analiz oluşturmak **arka plan görevi başlatmaz**: kayıt `QUEUED` durumunda oluşturulur, `celery_task_id`, `started_at` ve `finished_at` null kalır (Celery entegrasyonu sonraki iş kalemidir).
      summary: Analiz çalıştırması oluştur
      tags:
      - Analiz İşlemleri
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRunCreateRequest'
            examples:
              KuralTabanlı:
                value:
                  project: 1
                  method: RULE_BASED
                summary: Kural tabanlı
              LLM:
                value:
                  project: 1
                  method: DIRECT_LLM
                  llm_provider: GROQ
                  llm_model: openai/gpt-oss-120b
                summary: LLM
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnalysisRunCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnalysisRunCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunDetail'
              examples:
                OluşturulanAnaliz:
                  value:
                    id: 1
                    project: 1
                    status: QUEUED
                    method: DIRECT_LLM
                    llm_provider: GROQ
                    llm_model: openai/gpt-oss-120b
                    fallback_enabled: true
                    celery_task_id: null
                    coverage_percent: null
                    error_code: ''
                    error_message: ''
                    created_at: '2026-11-18T15:13:34.314827+03:00'
                    started_at: null
                    finished_at: null
                    updated_at: '2026-11-18T15:13:34.314850+03:00'
                    requirements_snapshot: []
                    generated_test_count: 0
                    progress:
                      total: 0
                      completed: 0
                      running: 0
                      pending: 0
                      by_status: {}
                      completed_duration_ms_total: 0
                      completed_with_duration: 0
                      run_started_at: null
                      percent: null
                  summary: Oluşturulan analiz
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                LLMAlanlarıEksik:
                  value:
                    llm_model:
                    - LLM yöntemlerinde llm_provider ve llm_model zorunludur.
                  summary: LLM alanları eksik
                RULEBASEDIleLLMAlanı:
                  value:
                    llm_provider:
                    - RULE_BASED yönteminde LLM sağlayıcı/model verilmez.
                  summary: RULE_BASED ile LLM alanı
                BaşkasınınVeyaOlmayanProje:
                  value:
                    project:
                    - Geçersiz pk "99999" - obje bulunamadı.
                  summary: Başkasının veya olmayan proje
                ProjedeAktifAnalizVar:
                  value:
                    non_field_errors:
                    - project  alanları benzersiz bir set yapmak gerekir.
                  summary: Projede aktif analiz var
          description: Doğrulama hatası. Gövde, alan adı → hata iletileri listesi
            biçimindedir (DRF standardı); nesne düzeyi hatalar `non_field_errors`
            altındadır.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenError'
              examples:
                TokenYok:
                  value:
                    detail: Giriş bilgileri verilmedi.
                  summary: Token yok
                GeçersizVeyaSüresiDolmuşToken:
                  value:
                    detail: Verilen token hiçbir token tipi için geçerli değil
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is invalid
                  summary: Geçersiz veya süresi dolmuş token
          description: Kimlik doğrulama yok, token geçersiz veya süresi dolmuş.
  /api/analysis-runs/{id}/:
    get:
      operationId: analysis_runs_retrieve
      description: Durum, görev kimliği, zaman damgaları ve test yürütme kayıtlarından
        türetilen ilerleme.
      summary: Analiz detayı ve ilerleme
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Analiz çalıştırması kimliği.
        required: true
      tags:
      - Analiz İşlemleri
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenError'
              examples:
                TokenYok:
                  value:
                    detail: Giriş bilgileri verilmedi.
                  summary: Token yok
                GeçersizVeyaSüresiDolmuşToken:
                  value:
                    detail: Verilen token hiçbir token tipi için geçerli değil
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is invalid
                  summary: Geçersiz veya süresi dolmuş token
          description: Kimlik doğrulama yok, token geçersiz veya süresi dolmuş.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
              examples:
                Bulunamadı:
                  value:
                    detail: No AnalysisRun matches the given query.
                  summary: Bulunamadı
          description: Kayıt yok **veya başka kullanıcıya ait** (sahiplik süzgeci;
            varlığı ifşa edilmez).
  /api/auth/login/:
    post:
      operationId: auth_login
      description: |-
        Kullanıcı adı ve parolayla SimpleJWT access/refresh token çifti döndürür.

        Hesap kilidi (django-axes, kullanıcı adı bazında): **3 başarısız denemeden sonra hesap 15 dakika kilitlenir**. Kilidi tetikleyen üçüncü başarısız deneme ve kilit süresince yapılan tüm denemeler (doğru parolayla bile) **429** döner. Kilit yanıtı (H5-03 / #41) `code: account_locked`, kilit bitiş zamanı `locked_until` (ISO 8601) ve kalan süre `retry_after_seconds` alanlarını ve aynı değerde `Retry-After` başlığını içerir; kilit kararı sunucudadır. Kilit süresi dolunca giriş yeniden yapılabilir; başarılı giriş sayacı sıfırlar. Hatalı kullanıcı adı ile hatalı parola aynı 401 yanıtını üretir (hesap varlığı ifşa edilmez). Ayrıca anonim giriş isteklerine istek sınırı uygulanır (`LOGIN_THROTTLE_RATE`, varsayılan 10/dk); bu sınır aşıldığında da 429 döner, ancak gövdede `code: account_locked` bulunmaz (yalnızca `detail`) ve `Retry-After` başlığı eklenir.
      summary: Giriş yap (access/refresh token al)
      tags:
      - Kimlik Doğrulama
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              GirişIsteği:
                value:
                  username: ornek_kullanici
                  password: <parola>
                summary: Giriş isteği
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              examples:
                TokenÇifti:
                  value:
                    access: <access-token>
                    refresh: <refresh-token>
                  summary: Token çifti
          description: Giriş başarılı.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                EksikAlan:
                  value:
                    username:
                    - Bu alan zorunlu.
                    password:
                    - Bu alan zorunlu.
                  summary: Eksik alan
          description: Doğrulama hatası. Gövde, alan adı → hata iletileri listesi
            biçimindedir (DRF standardı); nesne düzeyi hatalar `non_field_errors`
            altındadır.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
              examples:
                HatalıBilgiler:
                  value:
                    detail: Verilen kimlik bilgileriyle aktif bir hesap bulunamadı
                  summary: Hatalı bilgiler
          description: Hatalı kullanıcı adı veya parola (ayrım yapılmaz).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLocked'
              examples:
                HesapKilitli:
                  value:
                    detail: Çok fazla başarısız giriş denemesi. Hesap geçici olarak
                      kilitlendi; lütfen bir süre sonra tekrar deneyin.
                    code: account_locked
                    locked_until: '2026-01-01T12:15:00+03:00'
                    retry_after_seconds: 900
                  summary: Hesap kilitli
          description: Hesap kilitli veya giriş istek sınırı aşıldı.
  /api/auth/logout/:
    post:
      operationId: auth_logout
      description: Gönderilen refresh token kara listeye alınır; bu token ile artık
        yenileme yapılamaz. Access token süresi dolana kadar geçerli kalır (SimpleJWT
        davranışı).
      summary: Çıkış yap (refresh token'ı kara listeye al)
      tags:
      - Kimlik Doğrulama
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          description: Çıkış başarılı (gövde yok).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
              examples:
                EksikRefresh:
                  value:
                    detail: refresh alanı zorunludur.
                  summary: Eksik refresh
                GeçersizRefresh:
                  value:
                    detail: Geçersiz veya süresi dolmuş token.
                  summary: Geçersiz refresh
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenError'
              examples:
                TokenYok:
                  value:
                    detail: Giriş bilgileri verilmedi.
                  summary: Token yok
                GeçersizVeyaSüresiDolmuşToken:
                  value:
                    detail: Verilen token hiçbir token tipi için geçerli değil
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is invalid
                  summary: Geçersiz veya süresi dolmuş token
          description: Kimlik doğrulama yok, token geçersiz veya süresi dolmuş.
  /api/auth/me/:
    get:
      operationId: auth_me
      description: Kimliği doğrulanmış kullanıcının temel bilgileri. Parola veya token
        bilgisi döndürülmez.
      summary: Oturumdaki kullanıcı
      tags:
      - Kimlik Doğrulama
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                Kullanıcı:
                  value:
                    id: 1
                    username: ornek_kullanici
                    email: ornek@example.test
                  summary: Kullanıcı
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenError'
              examples:
                TokenYok:
                  value:
                    detail: Giriş bilgileri verilmedi.
                  summary: Token yok
                GeçersizVeyaSüresiDolmuşToken:
                  value:
                    detail: Verilen token hiçbir token tipi için geçerli değil
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is invalid
                  summary: Geçersiz veya süresi dolmuş token
          description: Kimlik doğrulama yok, token geçersiz veya süresi dolmuş.
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_request
      description: 'Adres kayıtlı ve hesap aktifse e-postaya `FRONTEND_PASSWORD_RESET_URL?uid=...&token=...`
        bağlantısı gönderilir. **Yanıt, adresin kayıtlı olup olmamasından bağımsız
        olarak aynıdır** (hesap varlığı ifşa edilmez); e-posta gönderim hataları da
        yanıtı değiştirmez. İstek sınırı: `LOGIN_THROTTLE_RATE`.'
      summary: Şifre sıfırlama bağlantısı iste
      tags:
      - Parola İşlemleri
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            examples:
              Talep:
                value:
                  email: kullanici@example.test
                summary: Talep
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                GenelYanıt:
                  value:
                    detail: E-posta kayıtlıysa şifre sıfırlama bağlantısı gönderildi.
                  summary: Genel yanıt
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                GeçersizE-posta:
                  value:
                    email:
                    - Geçerli bir e-posta adresi girin.
                  summary: Geçersiz e-posta
          description: Doğrulama hatası. Gövde, alan adı → hata iletileri listesi
            biçimindedir (DRF standardı); nesne düzeyi hatalar `non_field_errors`
            altındadır.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: İstek sınırı aşıldı.
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm
      description: 'E-postadaki `uid` ve `token` ile yeni parola belirlenir. Token
        Django''nun `PasswordResetTokenGenerator` token''ıdır; `PASSWORD_RESET_TIMEOUT`
        (varsayılan 3600 sn) sonunda geçersizleşir. **Tek kullanımlıktır**: parola
        değişince aynı bağlantı yeniden kullanılamaz. Geçersiz, süresi dolmuş ve kullanılmış
        bağlantılar aynı genel hatayı üretir.'
      summary: Yeni parola belirle
      tags:
      - Parola İşlemleri
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
            examples:
              YeniParola:
                value:
                  uid: <uid>
                  token: <token>
                  new_password: <yeni-parola>
                summary: Yeni parola
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                Başarılı:
                  value:
                    detail: Parola güncellendi.
                  summary: Başarılı
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                Geçersiz/süresiDolmuş/kullanılmışBağlantı:
                  value:
                    token:
                    - Bağlantı geçersiz veya süresi dolmuş.
                  summary: Geçersiz/süresi dolmuş/kullanılmış bağlantı
                EksikAlanlar:
                  value:
                    uid:
                    - Bu alan zorunlu.
                    token:
                    - Bu alan zorunlu.
                    new_password:
                    - Bu alan zorunlu.
                  summary: Eksik alanlar
          description: Doğrulama hatası. Gövde, alan adı → hata iletileri listesi
            biçimindedir (DRF standardı); nesne düzeyi hatalar `non_field_errors`
            altındadır.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: İstek sınırı aşıldı.
  /api/auth/refresh/:
    post:
      operationId: auth_refresh
      description: Geçerli refresh token ile yeni access token alınır. `ROTATE_REFRESH_TOKENS`
        açık olduğu için yanıtta **yeni bir refresh token** da döner; eski refresh
        token kara listeye alınır ve yeniden kullanılamaz (401).
      summary: Access token yenile
      tags:
      - Kimlik Doğrulama
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              examples:
                YeniTokenÇifti:
                  value:
                    access: <access-token>
                    refresh: <yeni-refresh-token>
                  summary: Yeni token çifti
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                EksikAlan:
                  value:
                    refresh:
                    - Bu alan zorunlu.
                  summary: Eksik alan
          description: Doğrulama hatası. Gövde, alan adı → hata iletileri listesi
            biçimindedir (DRF standardı); nesne düzeyi hatalar `non_field_errors`
            altındadır.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
              examples:
                GeçersizRefresh:
                  value:
                    detail: Token is invalid
                    code: token_not_valid
                  summary: Geçersiz refresh
          description: Refresh token geçersiz, süresi dolmuş veya kara listede.
  /api/projects/:
    get:
      operationId: projects_list
      description: Yalnızca oturumdaki kullanıcının projeleri, yeniden eskiye, sayfalı
        (`page`, `page_size` ≤ 100).
      summary: Projelerimi listele
      parameters:
      - name: page
        required: false
        in: query
        description: Sayfalanmış sonuç kümesinde bir sayfa numarası.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Her sayfada döndürülecek sonuç sayısı.
        schema:
          type: integer
      tags:
      - Proje Yönetimi
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenError'
              examples:
                TokenYok:
                  value:
                    detail: Giriş bilgileri verilmedi.
                  summary: Token yok
                GeçersizVeyaSüresiDolmuşToken:
                  value:
                    detail: Verilen token hiçbir token tipi için geçerli değil
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is invalid
                  summary: Geçersiz veya süresi dolmuş token
          description: Kimlik doğrulama yok, token geçersiz veya süresi dolmuş.
    post:
      operationId: projects_create
      description: |-
        `multipart/form-data` ile `name` (zorunlu), `description` (isteğe bağlı) ve `archive` (zorunlu, **.zip**) gönderilir. Sahip sunucuda oturumdaki kullanıcı olarak atanır. Yüklenen kod çalıştırılmaz, içe aktarılmaz ve diske açılmaz. Arşiv şu durumlarda 400 ile reddedilir: boş dosya, desteklenmeyen tür veya içerik, bozuk/kesik/şifreli arşiv, Zip Slip (`..`), mutlak/sürücü/UNC yolu, sembolik bağlantı, özel dosya, yinelenen/çakışan yollar, boyut/girdi/derinlik/oran sınırları (ZIP bombası), Django yapısı bulunamaması. **400 ile 413 farkı:** boyut sınırını aşan yükleme gövde okunurken durdurulur ve 413 döner; içeriği doğrulanıp reddedilen arşiv 400 döner.

        Sınırlar (ortam değişkenleriyle değiştirilebilir; bkz. backend/docs/h4_03_project_api.md §4): arşiv ≤ 50 MiB, açılmış toplam ≤ 200 MiB, tek dosya ≤ 20 MiB, ≤ 10000 girdi, derinlik ≤ 32, yol ≤ 240 karakter, sıkıştırma oranı ≤ 100.
      summary: ZIP arşivi yükleyerek proje oluştur
      tags:
      - Proje Yükleme
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                OluşturulanProje:
                  value:
                    id: 1
                    name: Mağaza API
                    description: ''
                    source_type: ARCHIVE
                    validation_status: VALID
                    archive:
                      original_name: magaza.zip
                      size_bytes: 1429
                      sha256: 6cd7e458160cd1c6bf515fbd899f4bca46fc6213c9825c70c6774f9c2a4ea7bc
                      uploaded_at: '2026-11-18T15:12:51.053405+03:00'
                    validation_report:
                      warnings: []
                      checked_at: '2026-11-18T12:12:51+00:00'
                      django_apps:
                      - shop
                      drf_detected: true
                      schema_version: 1
                      manage_py_found: true
                      manage_py_paths:
                      - manage.py
                      rejected_entries: []
                      settings_modules:
                      - config/settings.py
                      installed_apps_count: 4
                      declared_settings_modules:
                      - config.settings
                    analysis_run_count: 0
                    created_at: '2026-11-18T15:12:51.053405+03:00'
                    updated_at: '2026-11-18T15:12:51.053420+03:00'
                  summary: Oluşturulan proje
          description: Proje oluşturuldu.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveError'
              examples:
                ZipSlip:
                  value:
                    archive:
                    - code: PATH_TRAVERSAL
                      detail: Arşiv güvenli olmayan veya geçersiz girdiler içeriyor.
                      entries:
                      - path: ../evil.py
                        reason: PATH_TRAVERSAL
                  summary: Zip Slip
                DjangoProjesiDeğil:
                  value:
                    archive:
                    - code: NO_DJANGO_SETTINGS
                      detail: 'Arşivde Django ayar modülü bulunamadı: INSTALLED_APPS
                        içeren bir settings.py veya settings/ paketi gereklidir.'
                  summary: Django projesi değil
                EksikAlanlar:
                  value:
                    name:
                    - Bu alan zorunlu.
                    archive:
                    - Hiçbir dosya verilmedi.
                  summary: Eksik alanlar
                KorumalıAlan:
                  value:
                    owner:
                    - Bu alan istemci tarafından gönderilemez veya değiştirilemez.
                  summary: Korumalı alan
          description: Geçersiz arşiv (`archive[].code`) veya alan hatası (ör. `name`,
            korumalı alan gönderme).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenError'
              examples:
                TokenYok:
                  value:
                    detail: Giriş bilgileri verilmedi.
                  summary: Token yok
                GeçersizVeyaSüresiDolmuşToken:
                  value:
                    detail: Verilen token hiçbir token tipi için geçerli değil
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is invalid
                  summary: Geçersiz veya süresi dolmuş token
          description: Kimlik doğrulama yok, token geçersiz veya süresi dolmuş.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
              examples:
                ÇokBüyük:
                  value:
                    detail: Yüklenen dosya en fazla 52428800 bayt olabilir.
                  summary: Çok büyük
          description: Arşiv boyut sınırını aşıyor.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
              examples:
                YanlışIçerikTürü:
                  value:
                    detail: Proje oluşturma multipart/form-data ile yapılmalıdır.
                  summary: Yanlış içerik türü
          description: multipart/form-data dışı içerik türü.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Kullanıcı başına yükleme sınırı aşıldı (`PROJECT_UPLOAD_THROTTLE_RATE`).
