components:
  schemas:
    AccessRuleSpecification:
      type: object
      properties:
        schema_version:
          type: integer
          maximum: 1
          minimum: 1
        endpoint:
          type: string
          maxLength: 500
        method:
          $ref: '#/components/schemas/HttpMethodEnum'
        expected_status_by_role:
          type: object
          additionalProperties:
            type: integer
            maximum: 599
            minimum: 100
      required:
      - endpoint
      - expected_status_by_role
      - method
      - schema_version
    AccessRuleSpecificationRequest:
      type: object
      properties:
        schema_version:
          type: integer
          maximum: 1
          minimum: 1
        endpoint:
          type: string
          minLength: 1
          maxLength: 500
        method:
          $ref: '#/components/schemas/HttpMethodEnum'
        expected_status_by_role:
          type: object
          additionalProperties:
            type: integer
            maximum: 599
            minimum: 100
      required:
      - endpoint
      - expected_status_by_role
      - method
      - schema_version
    AccountLocked:
      type: object
      description: 'Hesap kilidi yanıtı (H5-03 / #41). İstek sınırı (throttle) 429''unda
        yalnızca ``detail`` döner.'
      properties:
        detail:
          type: string
        code:
          type: string
          description: Kilitte `account_locked`; istek sınırında yok.
        locked_until:
          type: string
          format: date-time
          nullable: true
          description: Kilidin kalkacağı zaman (bilgi amaçlı).
        retry_after_seconds:
          type: integer
          nullable: true
          description: Kilidin kalkmasına kalan saniye (Retry-After ile aynı).
      required:
      - detail
    AnalysisMethodEnum:
      enum:
      - RULE_BASED
      - DIRECT_LLM
      - HYBRID
      type: string
      description: |-
        * `RULE_BASED` - Kural tabanlı
        * `DIRECT_LLM` - Doğrudan LLM
        * `HYBRID` - Hibrit
    AnalysisRunCreateRequest:
      type: object
      description: |-
        `project` alanının queryset'ini istekteki kullanıcının projelerine indirger.

        Böylece başkasına ait / var olmayan proje kimliği, varlığı ifşa etmeden geçersiz pk (400) olur.
      properties:
        project:
          type: integer
        method:
          $ref: '#/components/schemas/AnalysisMethodEnum'
        llm_provider:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/LlmProviderEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        llm_model:
          type: string
          nullable: true
          maxLength: 100
        fallback_enabled:
          type: boolean
      required:
      - method
      - project
    AnalysisRunDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AnalysisRunStatusEnum'
          readOnly: true
          default: QUEUED
        method:
          allOf:
          - $ref: '#/components/schemas/AnalysisMethodEnum'
          readOnly: true
        llm_provider:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/LlmProviderEnum'
          - $ref: '#/components/schemas/NullEnum'
        llm_model:
          type: string
          readOnly: true
          nullable: true
        fallback_enabled:
          type: boolean
          readOnly: true
        celery_task_id:
          type: string
          readOnly: true
          nullable: true
        coverage_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        error_code:
          type: string
          readOnly: true
        error_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        requirements_snapshot:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
          description: Analiz oluşturulduğunda projenin aktif referans gereksinimlerinin
            anlık görüntüsü.
        generated_test_count:
          type: integer
          readOnly: true
        progress:
          allOf:
          - $ref: '#/components/schemas/ExecutionProgress'
          readOnly: true
      required:
      - celery_task_id
      - coverage_percent
      - created_at
      - error_code
      - error_message
      - fallback_enabled
      - finished_at
      - generated_test_count
      - id
      - llm_model
      - llm_provider
      - method
      - progress
      - project
      - requirements_snapshot
      - started_at
      - status
      - updated_at
    AnalysisRunList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AnalysisRunStatusEnum'
          readOnly: true
          default: QUEUED
        method:
          allOf:
          - $ref: '#/components/schemas/AnalysisMethodEnum'
          readOnly: true
        llm_provider:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/LlmProviderEnum'
          - $ref: '#/components/schemas/NullEnum'
        llm_model:
          type: string
          readOnly: true
          nullable: true
        fallback_enabled:
