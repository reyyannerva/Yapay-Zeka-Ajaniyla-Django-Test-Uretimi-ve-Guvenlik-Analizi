      - POST
      - PUT
      - PATCH
      - DELETE
      type: string
      description: |-
        * `GET` - GET
        * `POST` - POST
        * `PUT` - PUT
        * `PATCH` - PATCH
        * `DELETE` - DELETE
    LlmProviderEnum:
      enum:
      - GROQ
      - GEMINI
      - OLLAMA
      type: string
      description: |-
        * `GROQ` - Groq
        * `GEMINI` - Gemini
        * `OLLAMA` - Ollama
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    Me:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
      required:
      - email
      - id
      - username
    Message:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    NullEnum:
      enum:
      - null
    PaginatedProjectList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          description: E-postadaki bağlantıdan gelen base64 kullanıcı kimliği.
        token:
          type: string
          minLength: 1
          description: E-postadaki bağlantıdan gelen Django parola sıfırlama token'ı.
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          description: Django parola doğrulayıcılarından geçmelidir.
      required:
      - new_password
      - token
      - uid
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PatchedProjectUpdateRequest:
      type: object
      description: Yalnızca ``name`` ve ``description`` güncellenebilir; arşiv değiştirme
        desteklenmez.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 5000
    PatchedReferenceRequirementAPIRequest:
      type: object
      description: '#33''ün doğrulamasını (kategori/spesifikasyon/HTTP metodu) miras
        alır; projeyi sahibe sınırlar.'
      properties:
        project:
          type: integer
        requirement_code:
          type: string
          minLength: 1
          maxLength: 50
        category:
          $ref: '#/components/schemas/RequirementCategoryEnum'
        source:
          $ref: '#/components/schemas/RequirementSourceEnum'
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        expected_result:
          type: string
        specification:
          $ref: '#/components/schemas/ReferenceSpecificationRequest'
        is_active:
          type: boolean
    Project:
      type: object
      description: Okuma gösterimi. Depolama anahtarı, sunucu dosya adı ve mutlak
        yol döndürülmez.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        source_type:
          allOf:
          - $ref: '#/components/schemas/ProjectSourceTypeEnum'
          readOnly: true
        validation_status:
          allOf:
          - $ref: '#/components/schemas/ProjectValidationStatusEnum'
          readOnly: true
        archive:
          allOf:
          - $ref: '#/components/schemas/ArchiveInfo'
          nullable: true
          readOnly: true
        validation_report:
          readOnly: true
        analysis_run_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - analysis_run_count
      - archive
      - created_at
      - description
      - id
      - name
      - source_type
      - updated_at
      - validation_report
      - validation_status
    ProjectCreateRequest:
      type: object
      description: 'Proje oluşturma isteği (multipart/form-data): ``name``, isteğe
        bağlı ``description`` ve ``archive`` (.zip).'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          default: ''
          maxLength: 5000
        archive:
          type: string
          format: binary
      required:
      - archive
      - name
    ProjectSourceTypeEnum:
      enum:
      - ARCHIVE
      - ALLOWED_DIRECTORY
      type: string
      description: |-
        * `ARCHIVE` - Yüklenen arşiv
        * `ALLOWED_DIRECTORY` - İzinli dizin
    ProjectUpdateRequest:
      type: object
      description: Yalnızca ``name`` ve ``description`` güncellenebilir; arşiv değiştirme
        desteklenmez.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 5000
      required:
      - name
    ProjectValidationStatusEnum:
      enum:
      - PENDING
      - VALID
      - INVALID
      type: string
      description: |-
        * `PENDING` - Bekliyor
        * `VALID` - Geçerli
        * `INVALID` - Geçersiz
    ReferenceRequirementAPI:
      type: object
      description: '#33''ün doğrulamasını (kategori/spesifikasyon/HTTP metodu) miras
        alır; projeyi sahibe sınırlar.'
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
        requirement_code:
          type: string
          maxLength: 50
        category:
          $ref: '#/components/schemas/RequirementCategoryEnum'
        source:
          $ref: '#/components/schemas/RequirementSourceEnum'
        title:
          type: string
          maxLength: 200
        description:
          type: string
        expected_result:
          type: string
        specification:
          $ref: '#/components/schemas/ReferenceSpecification'
        is_active:
          type: boolean
        revision:
          type: integer
          readOnly: true
        http_method:
          allOf:
          - $ref: '#/components/schemas/HttpMethodEnum'
          nullable: true
          readOnly: true
          description: ACCESS_RULE satırının HTTP metodu; diğer kategorilerde null.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - http_method
      - id
      - project
      - requirement_code
      - revision
      - title
      - updated_at
    ReferenceRequirementAPIRequest:
      type: object
      description: '#33''ün doğrulamasını (kategori/spesifikasyon/HTTP metodu) miras
        alır; projeyi sahibe sınırlar.'
      properties:
        project:
          type: integer
        requirement_code:
          type: string
          minLength: 1
          maxLength: 50
        category:
          $ref: '#/components/schemas/RequirementCategoryEnum'
        source:
          $ref: '#/components/schemas/RequirementSourceEnum'
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        expected_result:
          type: string
        specification:
          $ref: '#/components/schemas/ReferenceSpecificationRequest'
        is_active:
          type: boolean
      required:
      - category
      - project
      - requirement_code
      - title
    ReferenceSpecification:
      oneOf:
      - $ref: '#/components/schemas/RoleSpecification'
      - $ref: '#/components/schemas/AccessRuleSpecification'
      - $ref: '#/components/schemas/DeployExpectationSpecification'
    ReferenceSpecificationRequest:
      oneOf:
      - $ref: '#/components/schemas/RoleSpecificationRequest'
      - $ref: '#/components/schemas/AccessRuleSpecificationRequest'
      - $ref: '#/components/schemas/DeployExpectationSpecificationRequest'
    RequirementCategoryEnum:
      enum:
      - ROLE
      - ACCESS_RULE
      - DEPLOY_EXPECTATION
      type: string
      description: |-
        * `ROLE` - Rol
        * `ACCESS_RULE` - Erişim kuralı
        * `DEPLOY_EXPECTATION` - Dağıtım beklentisi
    RequirementSourceEnum:
      enum:
      - FORM
      - JSON_UPLOAD
      type: string
      description: |-
        * `FORM` - Form
        * `JSON_UPLOAD` - JSON yükleme
    RoleSpecification:
      type: object
      properties:
        schema_version:
          type: integer
          maximum: 1
          minimum: 1
        role:
          type: string
          maxLength: 50
      required:
      - role
      - schema_version
    RoleSpecificationRequest:
      type: object
      properties:
        schema_version:
          type: integer
          maximum: 1
          minimum: 1
        role:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - role
      - schema_version
    TokenError:
      type: object
      description: Geçersiz veya süresi dolmuş access token ile korumalı uç nokta
        çağrıldığında SimpleJWT yanıtı.
      properties:
        detail:
          type: string
        code:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/TokenErrorMessage'
      required:
      - code
      - detail
    TokenErrorMessage:
      type: object
      properties:
        token_class:
          type: string
        token_type:
          type: string
        message:
          type: string
      required:
      - message
      - token_class
      - token_type
    TokenPair:
      type: object
      properties:
        access:
          type: string
          description: Access token (varsayılan ömür 15 dk, JWT_ACCESS_MINUTES).
        refresh:
          type: string
          description: Refresh token (varsayılan ömür 7 gün, JWT_REFRESH_DAYS).
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    ValidationError:
      type: object
      description: 'Gösterim amaçlı: gerçek gövdede anahtarlar istekteki alan adlarıdır
        (ör. ``name``, ``specification``).'
      properties:
        field_name:
          type: array
          items:
            type: string
          description: Alan adı → hata iletileri (örnekler gerçek yanıtlardır).
        non_field_errors:
          type: array
          items:
            type: string
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Kimlik Doğrulama
  description: SimpleJWT giriş, token yenileme, çıkış ve oturum bilgisi.
- name: Parola İşlemleri
  description: E-posta ile şifre sıfırlama talebi ve yeni parola belirleme.
- name: Proje Yükleme
  description: multipart/form-data ile ZIP arşivi yükleyerek proje oluşturma.
- name: Proje Yönetimi
  description: Kullanıcının projelerini listeleme, görüntüleme, güncelleme, silme.
- name: Analiz İşlemleri
  description: Analiz çalıştırması oluşturma (QUEUED), listeleme ve detay.
- name: Referans Gereksinimler
  description: Bağımsız referans gereksinim JSON'u (ROLE, ACCESS_RULE, DEPLOY_EXPECTATION)
    CRUD.
