      - created_at
      - error_code
      - error_message
      - fallback_enabled
      - finished_at
      - id
      - llm_model
      - llm_provider
      - method
      - project
      - started_at
      - status
      - updated_at
    AnalysisRunStatusEnum:
      enum:
      - QUEUED
